<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { display: flex; align-items: flex-start; justify-content: center; padding-top: 14px; box-sizing: border-box;
         font-family: "Malgun Gothic", "Noto Sans KR", "Segoe UI", sans-serif; }
  #b { max-width: 700px; min-width: 300px; padding: 20px 34px; border-radius: 20px; text-align: center;
       font-size: 26px; font-weight: 800; letter-spacing: -0.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
       box-shadow: 0 10px 28px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.12); background: #fff; color: #000; }
  #b.in { animation: drop .26s cubic-bezier(.2,.9,.3,1.25); }
  @keyframes drop { from { transform: translateY(-36px); } to { transform: none; } }
</style>
</head>
<body>
  <div id="b">교수님을 바라보세요!</div>
  <script src="banner.js"></script>
</body>
</html>
