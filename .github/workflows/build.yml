name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build debug APK
        run: |
          chmod +x gradlew
          # 다운로드 서버가 일시적으로 504를 낼 때가 있어 최대 4번 재시도
          for i in 1 2 3 4; do
            ./gradlew assembleDebug --no-daemon && break
            echo "Build attempt $i failed, retrying in 30s..."
            sleep 30
            [ "$i" = 4 ] && exit 1
          done
          cp app/build/outputs/apk/debug/app-debug.apk HeadsUp.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: HeadsUp build ${{ github.run_number }}
          files: HeadsUp.apk
          make_latest: true
