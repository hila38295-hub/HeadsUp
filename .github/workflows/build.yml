name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub 다운로드 서버가 불안정할 때를 대비해 미러에서도 Gradle을 받아 온다
      - name: Get Gradle 8.14.3
        run: |
          for url in \
            https://services.gradle.org/distributions/gradle-8.14.3-bin.zip \
            https://mirrors.cloud.tencent.com/gradle/gradle-8.14.3-bin.zip \
            https://mirrors.huaweicloud.com/gradle/gradle-8.14.3-bin.zip \
            https://mirrors.aliyun.com/gradle/distributions/v8.14.3/gradle-8.14.3-bin.zip; do
            for i in 1 2 3; do
              echo "Downloading from $url (try $i)"
              curl -fsSL --connect-timeout 20 --max-time 300 -o /tmp/gradle.zip "$url" && break 2
              sleep 15
            done
          done
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.14.3/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: |
          gradle --version
          # 라이브러리 다운로드가 일시적으로 실패할 때를 대비해 재시도
          for i in 1 2 3 4 5 6; do
            gradle assembleDebug --no-daemon 2>&1 | tee build.log && break
            # 코드 오류는 다시 해도 똑같으니 바로 멈춘다 (네트워크 오류만 재시도)
            if grep -qE "^e: |AAPT: error" build.log; then exit 1; fi
            [ "$i" = 6 ] && exit 1
            echo "Build attempt $i failed, retrying in 60s..."
            sleep 60
          done
          cp app/build/outputs/apk/debug/app-debug.apk HeadsUp.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: HeadsUp build ${{ github.run_number }}
          files: HeadsUp.apk
          make_latest: true
